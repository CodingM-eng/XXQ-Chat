name: XXQ Chat CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build-web-and-server:
    name: Backend & Web Tests & Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Run Server Verification Tests
        run: pnpm --filter xxq-chat-server test

      - name: Build Server
        run: pnpm --filter xxq-chat-server build

      - name: Run Web Tests
        run: pnpm --filter xxq-chat-web test

      - name: Build Web Production Bundle
        run: pnpm --filter xxq-chat-web build

  test-and-build-android:
    name: Android Native Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xxq-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
