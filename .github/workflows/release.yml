name: XXQ Chat Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    name: Build Windows Desktop Release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Build Web Production Assets
        env:
          VITE_API_URL: https://xxq-chat-backend.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCCk8A6picstXW0qSMCXB75tAuj47BfJps' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'xxq-chat.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'xxq-chat' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'xxq-chat.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '361932070636' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:361932070636:web:086c009ce9f7fb68998fc9' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-CXJNKZYRLG' }}
        run: pnpm --filter xxq-chat-web build

      - name: Copy Web Dist to Desktop
        run: Copy-Item -Recurse -Force "web\dist" "desktop\web"

      - name: Build Windows Installer (NSIS)
        run: pnpm --filter xxq-chat-desktop build

      - name: Verify Windows Installer Executable
        run: |
          if (-not (Test-Path "desktop\release\XXQ-Chat-Setup.exe")) {
            throw "XXQ-Chat-Setup.exe was not generated by electron-builder packaging!"
          }
          $item = Get-Item "desktop\release\XXQ-Chat-Setup.exe"
          Write-Host "Generated installer size: $($item.Length) bytes"
          if ($item.Length -lt 20000000) {
            throw "XXQ-Chat-Setup.exe is suspiciously small ($($item.Length) bytes)!"
          }
          $hash = (Get-FileHash "desktop\release\XXQ-Chat-Setup.exe" -Algorithm SHA256).Hash
          Set-Content -Path "desktop\release\XXQ-Chat-Setup.exe.sha256" -Value "$hash  XXQ-Chat-Setup.exe"
          Write-Host "SHA256: $hash"

      - name: Archive Windows Unpacked Portable
        run: |
          if (Test-Path "desktop\release\win-unpacked") {
            Compress-Archive -Path "desktop\release\win-unpacked\*" -DestinationPath "desktop\release\XXQ-Chat-Windows-x64.zip" -Force
          }

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xxq-chat-windows-installer
          path: |
            desktop/release/XXQ-Chat-Setup.exe
            desktop/release/XXQ-Chat-Setup.exe.sha256
            desktop/release/XXQ-Chat-Windows-x64.zip
          if-no-files-found: error

  build-android-apk:
    name: Build Android APK Release (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Release / Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xxq-chat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-linux-packages:
    name: Build Linux Packages (.AppImage, .deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Build Web Production Assets
        env:
          VITE_API_URL: https://xxq-chat-backend.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCCk8A6picstXW0qSMCXB75tAuj47BfJps' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'xxq-chat.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'xxq-chat' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'xxq-chat.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '361932070636' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:361932070636:web:086c009ce9f7fb68998fc9' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-CXJNKZYRLG' }}
        run: pnpm --filter xxq-chat-web build

      - name: Copy Web Dist to Desktop
        run: |
          mkdir -p desktop/web
          cp -r web/dist/* desktop/web/

      - name: Build Linux Packages (AppImage & deb)
        run: pnpm --filter xxq-chat-desktop run build:linux

      - name: Verify Linux Packages
        run: |
          ls -la desktop/release/
          shopt -s nullglob
          appimages=(desktop/release/*.AppImage)
          debs=(desktop/release/*.deb)
          if [ ${#appimages[@]} -eq 0 ] && [ ${#debs[@]} -eq 0 ]; then
            echo "Expected Linux packages not found!"
            exit 1
          fi

      - name: Upload Linux Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xxq-chat-linux-packages
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: warn

  publish-github-release:
    name: Create GitHub Release with Artifacts
    needs: [build-windows-exe, build-android-apk, build-linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: xxq-chat-windows-installer
          path: release-artifacts/windows

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: xxq-chat-android-apk
          path: release-artifacts/android

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: xxq-chat-linux-packages
          path: release-artifacts/linux

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p dist-release
          cp release-artifacts/windows/XXQ-Chat-Setup.exe dist-release/XXQ-Chat-Setup.exe
          cp release-artifacts/windows/XXQ-Chat-Setup.exe.sha256 dist-release/XXQ-Chat-Setup.exe.sha256
          if [ -f release-artifacts/windows/XXQ-Chat-Windows-x64.zip ]; then
            cp release-artifacts/windows/XXQ-Chat-Windows-x64.zip dist-release/XXQ-Chat-Windows-x64.zip
          fi
          cp release-artifacts/android/app-debug.apk dist-release/XXQ-Chat-Android-debug.apk
          if [ -d release-artifacts/linux ]; then
            cp release-artifacts/linux/* dist-release/ 2>/dev/null || true
          fi
          cd dist-release
          sha256sum $(find . -maxdepth 1 -type f ! -name "*.sha256" ! -name "SHA256SUMS.txt") > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          name: XXQ Chat Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
