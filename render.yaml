services:
  # ============================================================================
  # 1. XXQ Chat Backend API & WebSocket Gateway Service (100% No-Cost Setup)
  # ============================================================================
  - type: web
    name: xxq-chat-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@12.11.2 --activate && pnpm install --frozen-lockfile --trust-lockfile && pnpm --filter xxq-chat-server build
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # CORS Origin: Restrict to your frontend domain in production.
      # By default, Render assigns https://xxq-chat-frontend.onrender.com to the static site below.
      # If your Render dashboard assigns a suffixed subdomain, update this value to match.
      - key: CORS_ORIGIN
        value: https://xxq-chat-frontend.onrender.com
      # Designated Initial System Administrator
      - key: INITIAL_ADMIN_EMAIL
        value: codingdevelopia@gmail.com
      # Whitelist Access Control (enabled by default)
      - key: WHITELIST_MODE_DEFAULT
        value: 'true'
      # Production Persistence: Firebase Cloud Firestore (No-cost Spark Tier)
      - key: DB_DRIVER
        value: firestore
      - key: JWT_DEV_SECRET
        generateValue: true
      # Firebase Admin Production Credentials (configure in Render Dashboard - NEVER commit)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # ============================================================================
  # 2. XXQ Chat Web Frontend (Single Page Application - Render Static Site)
  # ============================================================================
  - type: web
    name: xxq-chat-frontend
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@12.11.2 --activate && pnpm install --frozen-lockfile --trust-lockfile && pnpm --filter xxq-chat-web build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Connects frontend to the backend service above
      - key: VITE_API_URL
        value: https://xxq-chat-backend.onrender.com
      # Client Firebase credentials for Google Sign-In (enter these in Render Dashboard for xxq-chat-frontend):
      # VITE_FIREBASE_API_KEY: AIzaSyCCk8A6picstXW0qSMCXB75tAuj47BfJps
      # VITE_FIREBASE_AUTH_DOMAIN: xxq-chat.firebaseapp.com
      # VITE_FIREBASE_PROJECT_ID: xxq-chat
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
